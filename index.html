<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GoldenSpots</title>
  <meta name="description" content="Find the best sunrise and sunset spots in your city, and the day the sky is most likely to deliver.">
  <meta name="theme-color" content="#171a2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GoldenSpots">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="city" id="city-button" type="button" aria-haspopup="dialog">
        <span class="city-name" id="city-name">Finding your location</span>
        <svg class="caret" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-button" id="refresh" type="button" aria-label="Refresh forecast">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="kind" role="radiogroup" aria-label="Sunrise or sunset">
      <button type="button" role="radio" id="kind-sunrise" data-kind="sunrise" aria-checked="false">Sunrise</button>
      <button type="button" role="radio" id="kind-sunset" data-kind="sunset" aria-checked="true">Sunset</button>
    </div>

    <p class="notice" id="notice" role="status" hidden></p>

    <main>
      <section id="hero" class="hero" aria-live="polite"></section>
      <section aria-labelledby="days-title">
        <h2 id="days-title" class="section-title">Next seven days</h2>
        <div id="days" class="days"></div>
      </section>
      <section aria-labelledby="spots-title">
        <h2 id="spots-title" class="section-title">Best spots</h2>
        <div id="spots"></div>
      </section>
    </main>

    <footer class="foot">
      <p>Sun times are calculated on your device. Forecast and elevation from Open-Meteo, places from OpenStreetMap, photos from Wikimedia Commons.</p>
    </footer>
  </div>

  <dialog id="city-dialog" class="sheet" aria-labelledby="city-dialog-title">
    <div class="sheet-body">
      <div class="sheet-head">
        <h2 id="city-dialog-title">Change city</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="city-form" class="search" autocomplete="off">
        <label class="visually-hidden" for="city-input">City</label>
        <input id="city-input" type="search" placeholder="Search for a city" enterkeyhint="search" autocapitalize="words" spellcheck="false">
        <button type="submit" class="primary">Search</button>
      </form>
      <button type="button" class="link-button" id="use-location">Use my current location</button>
      <p class="hint" id="city-message" role="status"></p>
      <ul class="results" id="city-results"></ul>
    </div>
  </dialog>

  <dialog id="spot-dialog" class="sheet" aria-labelledby="spot-title">
    <div class="sheet-body" id="spot-body"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
